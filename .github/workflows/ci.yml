name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Add uv to PATH
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Run Schema Validator & Graph Builder
      run: uv run tools/validate_and_build.py --profile ALL
    - name: Run Schema Validator (Core Isolation Test)
      run: uv run tools/validate_and_build.py --profile core

    - name: Run Test Suite
      run: uv run --with pytest pytest tests/
